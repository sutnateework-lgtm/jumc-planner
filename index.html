<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUMC NEXT Content Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FA;--card:#fff;--ink:#1C2038;--mute:#626782;--line:#E0E3EE;--pink:#D81B7A;--on-pink:#fff;
--aw:#2F62D6;--co:#7A3FC9;--cv:#D81B7A;--ex:#1B8F63;--pr:#9A6410;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13152A;--card:#1C2040;--ink:#EDEEF7;--mute:#9EA3C4;--line:#303560;--pink:#FF5FA8;--on-pink:#1C0F18;--aw:#7CA2FF;--co:#B796FF;--cv:#FF7FB9;--ex:#4FD1A0;--pr:#E8B45A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13152A;--card:#1C2040;--ink:#EDEEF7;--mute:#9EA3C4;--line:#303560;--pink:#FF5FA8;--on-pink:#1C0F18;--aw:#7CA2FF;--co:#B796FF;--cv:#FF7FB9;--ex:#4FD1A0;--pr:#E8B45A;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.strip{display:flex;gap:3px;margin:0 0 6px}
.strip i{flex:1;height:14px;border-radius:3px;background:var(--line);cursor:pointer;border:0;padding:0}
.strip i[data-s="4"]{background:var(--ex)}
.strip i[data-s="3"]{background:var(--pink)}
.strip i[data-s="2"],.strip i[data-s="1"]{background:var(--pr)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mute);margin-bottom:18px}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--line)}
.legend .l4::before{background:var(--ex)}.legend .l3::before{background:var(--pink)}.legend .l2::before{background:var(--pr)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;border:1px solid var(--pink);background:var(--pink);color:var(--on-pink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--pink)}
.btn.danger{border-color:#C0392B;color:#C0392B;background:transparent}
.sp{flex:1}
h2{font-size:15px;font-weight:700;color:var(--mute);margin:22px 0 8px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--pink)}
.d{font-weight:800;line-height:1.15;text-align:center}
.d small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.d b{font-size:24px}
.t{font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;font-size:12.5px;color:var(--mute)}
.tag{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:0 8px;font-weight:700}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ex)}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.5);display:none;z-index:20}
.ov.on{display:block}
.pan{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.pan h3{margin:0;font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:110px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--pink)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.sec{margin-top:20px;padding-top:6px;border-top:1px solid var(--line);font-weight:800}
.acts{display:flex;gap:8px;margin-top:20px}
@media (max-width:520px){.item{grid-template-columns:50px 1fr}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root:root:root{--bg:#07070C;--card:#12121B;--ink:#F3F4FA;--mute:#9A9DB5;--line:#26263A;--pink:#FF4FA3;--on-pink:#14000B;--blue:#3DA9FF;--aw:#3DA9FF;--co:#8F9BFF;--cv:#FF4FA3;--ex:#FF9BCB;--pr:#A9B0C8;color-scheme:dark}
:root:root[data-theme="light"]{--bg:#F6F7FB;--card:#FFFFFF;--ink:#12131F;--mute:#5C6080;--line:#DDE0EE;--pink:#D81B7A;--on-pink:#FFFFFF;--blue:#1473D6;--aw:#1473D6;--co:#5A55D6;--cv:#D81B7A;--ex:#E0589F;--pr:#6A7090;color-scheme:light}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .chip{white-space:nowrap;flex:none}
h1{background:linear-gradient(90deg,var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat b{color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.strip i[data-s="4"]{background:var(--blue)}
.strip i[data-s="2"],.strip i[data-s="1"]{background:var(--co)}
.legend .l4::before{background:var(--blue)}
.legend .l2::before{background:var(--co)}
.prog i{background:linear-gradient(90deg,var(--pink),var(--blue))}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.cw{font-size:12px;color:var(--mute);text-align:center;padding:4px 0;font-weight:700}
.cd{min-height:90px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;position:relative;overflow:hidden}
.cd.o{background:transparent;border-color:transparent}
.cd>b{font-size:12px;color:var(--mute);font-weight:700}
.plus{position:absolute;top:2px;right:3px;width:22px;height:22px;line-height:20px;padding:0;border:0;border-radius:5px;background:transparent;color:var(--mute);cursor:pointer;font-size:15px}
.plus:hover{color:var(--pink)}
.ev.sh{background:transparent;border:1px dashed var(--blue);border-left:3px solid var(--blue)}
.dn{border:0;background:transparent;color:var(--mute);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0 4px;border-radius:4px}
.dn:hover{color:var(--ink);background:var(--line)}
.ml{font-size:10.5px;font-weight:700;margin-left:2px}
.cd.m-class{background:color-mix(in srgb,var(--blue) 16%,var(--card));border-color:var(--blue)}
.cd.m-trip{background:color-mix(in srgb,var(--pink) 16%,var(--card));border-color:var(--pink)}
.m-class .ml{color:var(--blue)}.m-trip .ml{color:var(--pink)}
.cd.dov{outline:2px dashed var(--pink)}
.legend .lc::before{background:var(--blue)}.legend .lt::before{background:var(--pink)}.legend .ls::before{background:transparent;border:1px dashed var(--blue)}
.legend{margin:10px 0 0}
.idea{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.grip{cursor:grab;color:var(--mute);text-align:center;user-select:none;padding-top:6px;font-size:18px}
.idea textarea{min-height:46px;height:46px}
.ia{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.ia input,.ia select{width:auto}
.btn.sm{padding:4px 10px;font-size:13px}
:root:root:root{--purple:#B07CFF}
:root:root[data-theme="light"]{--purple:#7A3FC9}
.cd.m-event{background:color-mix(in srgb,var(--purple) 18%,var(--card));border-color:var(--purple)}
.m-event .ml{color:var(--purple)}
.legend .le::before{background:var(--purple)}
.ev[draggable]{cursor:grab}
.tt{display:flex;align-items:center;gap:10px}
.logo{font-size:30px;line-height:1}
.goal{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:var(--card) linear-gradient(135deg,color-mix(in srgb,var(--pink) 10%,transparent),color-mix(in srgb,var(--blue) 10%,transparent))}
.gl-top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.gl-t{font-weight:800}
.gl-e{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin:0;font-weight:500}
.gl-e input{width:96px;padding:4px 8px}
.gl-n{margin:6px 0 8px;font-size:15px}
.gl-n b{font-size:30px;font-weight:800;color:var(--blue)}
.gl-bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.gl-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--blue));transition:width .4s}
.gl-ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.ms{color:var(--mute);border:1px dashed var(--line);border-radius:999px;padding:0 8px}
.ms.on{color:var(--ink);border:1px solid var(--pink);background:color-mix(in srgb,var(--pink) 14%,transparent)}
.gl-note{color:var(--mute);font-size:12.5px;margin-top:6px}
.cd{padding-bottom:22px}
#chips{display:none!important}
:root:root:root{--hol:#FFC247}
:root:root[data-theme="light"]{--hol:#B26A00}
.hl{font-size:10.5px;font-weight:700;color:var(--hol);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cd.hol{border-top:2px solid var(--hol)}
.cd.hol>.dn{color:var(--hol)}
.io{margin:0 0 12px}
.io .chip{font-size:13px}
.legend .lh::before{background:var(--hol)}
.ap{position:absolute;right:4px;bottom:3px;font-size:11px;font-weight:700;line-height:1.5;padding:0 7px;border-radius:999px;color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,transparent)}
.ev{display:block;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;color:var(--ink);background:color-mix(in srgb,var(--c) 24%,transparent);border:0;border-left:3px solid var(--c);border-radius:4px;padding:2px 4px;margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.cd{min-height:66px}.ev{font-size:10px;padding:1px 3px}}
</style>
</head>

ช้อุปกรณ์อิเล็กทรอนิกส์ทุกชนิด หากมีการทุจริตทางคณะกรรมการขออนุญาตตัดสิทธิสอบ และเชิญออกจากห้องสอบโดยทันที\n5. ทางโครงการไม่มีพื้นที่ฝากสัมภาระ สามารถวางไว้ข้างตัวได้ขณะทำข้อสอบ จึงขอความร่วมมือนำมาเฉพาะสิ่งของที่จำเป็นเท่านั้น\n6. สามารถนำน้ำเปล่า หรือขวดน้ำที่มีฝาปิดเข้าห้องสอบได้ แต่ไม่อนุญาตให้นำแก้วน้ำและอาหารเข้าห้องสอบ\n7. ระหว่างการสอบผู้สมัครจะไม่สามารถออกมาเข้าห้องน้ำได้\n8. สามารถจอดรถได้ที่ อาคารจอดรถคณะอักษรศาสตร์ อาคารจอดรถคณะรัฐศาสตร์ อาคารจามจุรีสแควร์ หรือ ศูนย์การค้าสามย่านมิตรทาวน์ (มีค่าที่จอดรถ)\n9. หากเดินทางโดยรถไฟฟ้าใต้ดิน MRT สามารถลงได้ที่ สถานีสามย่าน หรือ BTS ลงสถานีสยาม โดยต่อรถมาที่อาคารมหิตลาธิเบศร\n.\n.\nขอให้น้อง ๆ ทุกคนโชคดีในวันสอบ\nและแสดงศักยภาพของตัวเองออกมาอย่างเต็มที่✨\n#JUMCNEXT #JUMCNEXT19 #JUMC #MBA","views":"","saves":"","clicks":"","leads":"","note":""},{"id":"iyao0xg3","date":"2027-03-23","title":"📍 แผนที่สถานที่สอบข้อเขียน JUMC NEXT","phase":"aw","pillar":"อยากมา","platform":"","status":0,"progress":0,"detail":"โปรดตรวจสอบสถานที่สอบและเส้นทางล่วงหน้า เพื่อความสะดวกในวันสอบ\n📅 วันสอบ : 28 มีนาคม 2569 (เปิดเริ่มลงทะเบียน 13:30-14:00)\nอาคารมหิตลาธิเบศร จุฬาลงกรณ์มหาวิทยาลัย\n.\nแนะนำให้น้อง ๆ เดินทางมาถึงก่อนเวลาประมาณ 15-30 นาที\nเพื่อทำการลงทะเบียนและเตรียมตัวก่อนเข้าสอบ\n*กรุณาเผื่อเวลาเดินทาง กรณีการจราจรติดขัด\n#JUMCNEXT #JUMCNEXT19 #JUMC #MBA","views":"","saves":"","clicks":"","leads":"","note":""},{"id":"is8a2ztt","date":"2027-03-26","title":"📢 Reminder  พรุ่งนี้คือวันสอบข้อเขียนของโครงการ JUMC NEXT 🩷🩵","phase":"aw","pillar":"อยากมา","platform":"","status":0,"progress":0,"detail":"อย่าลืมตรวจสอบ\n✔ รายชื่อผู้มีสิทธิ์สอบ\n✔ สถาน-เวลาที่สอบ\n✔ สิ่งที่ต้องเตรียมมา\n.\n🚨 การเตรียมตัวสำหรับสอบข้อเขียนและคำถามที่พบบ่อย\n1. เนื้อหาการสอบเป็นความรู้ทั่วไปและเนื้อหาเบื้องต้นเกี่ยวกับธุรกิจ\n2. กรุณานำเครื่องเขียนมาให้พร้อม เช่น ปากกา ปากกาลบคำผิด\n3. กรุณาแต่งกายสุภาพ โดยงดสวมกางเกงขาสั้นหรือขาสามส่วน รวมถึงกระโปรงสั้นและเสื้อแขนกุด รองเท้าแตะหรือรองเท้าไม่หุ้มส้น และสามารถพกเสื้อกันหนาวมาเผื่อได้\n4. ไม่อนุญาตให้ใช้โทรศัพท
